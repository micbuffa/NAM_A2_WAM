<script>
  let DeadGateTemp = document.currentScript.ownerDocument.querySelector('#template-utility');

  class DeadGateGui extends HTMLElement {


    constructor(plug) {

      super();
      this._plug = plug;
      this._plug.gui = this;
      //console.log(this._plug);
      this._root = this.attachShadow({
        mode: 'open'
      });
      this._root.appendChild(DeadGateTemp.content.cloneNode(true));
      this.knobs = this._root.querySelectorAll(".knob");
      this.state = new Object();
      this.setKnobs();
      this.setLRListeners();
      this.setResources();
    }

    connectedCallback() {
      this.createPeakMeter();
    }

    createPeakMeter() {
      var meterElementInput = this._root.querySelector('#my-peak-meter-in');
      this._plug.createMeterNodeInput(meterElementInput);

      var meterElementOutput = this._root.querySelector('#my-peak-meter-out');
      this._plug.createMeterNodeOutput(meterElementOutput);
    }

    attributeChangedCallback() {
      console.log("attribute changed callback");
      this.state = JSON.parse(this.getAttribute('state'));
      console.log(this.state);
      if (this.state.status == "enable") {
        this._root.querySelector(".switch").querySelector("webaudio-switch").value = 1;
        this.isOn = true;
      }
      //this.labels = this._root.querySelectorAll(".knob-label");
      for (var i = 0; i < this.knobs.length; i++) {
        console.log("restoring state of knob : " + this.knobs[i].querySelector("webaudio-knob").id)
        //this.knobs[i].querySelector("webaudio-konb").value = this.state[this.labels[i].innerHTML.toLowerCase().replace(/ /g, "")] * 100;
        this.knobs[i].querySelector("webaudio-knob").value = this.state[this.knobs[i].querySelector("webaudio-knob")
          .id];
      }

      this.setLRColors(this.state.leftInput, this.state.rightInput);
      this._plug.setInputRoutes(this.state.leftInput, this.state.rightInput);
    }

    get properties() {
      this.boundingRect = {
        dataWidth: {
          type: Number,
          value: 232
        },
        dataHeight: {
          type: Number,
          value: 272
        }
      };
      return this.boundingRect;
    }

    static get observedAttributes() {
      return ['state'];
    }

    setResources() {
      // Sets the background image and style.
      // var background = this._root.querySelector('img');
      // background.src = this._plug.URL + '/assets/undefined';
      // background.style = 'border-radius : 10px;'
      var background = this._root.querySelector("img");
      background.src = this._plug.URL + '/assets/utility.png';
      background.style = 'border-radius :10px;'

      this._root.querySelectorAll(".knob").forEach((knob) => {
        knob.querySelector("webaudio-knob").setAttribute('src', this._plug.URL + '/assets/Jambalaya.png');
      });
    }

    setKnobs() {
      this._root.querySelector("#inputGainDiv").querySelector("webaudio-knob").addEventListener('input', (e) =>
        this._plug.inputGain = e.target.value);
      this._root.querySelector("#noisegate").querySelector("webaudio-knob").addEventListener('input', (e) =>
        this._plug.noiseGate = e.target.value);
      this._root.querySelector("#deadzone").querySelector("webaudio-knob").addEventListener('input', (e) => this._plug
        .setParam("/FaustDeadGate/Dead_Zone", e.target.value));
    }

    setLRColors(inputLeft, inputRight) {
      let l_in = this._root.querySelector("#label_l_in");
      let r_in = this._root.querySelector("#label_r_in");

      l_in.style.color = inputLeft ? "lightgreen" : "red";
      r_in.style.color = inputRight ? "lightgreen" : "red";
    }

    updateRoutes(l_in, r_in) {
      let left = (l_in.style.color === "lightgreen") || (l_in.style.color === "");
      let right = (r_in.style.color === "lightgreen") || (r_in.style.color === "");

      this._plug.params.leftInput = left;
      this._plug.params.rightInput = right;
      this._plug.setInputRoutes(left, right);
    }

    setLRListeners() {
      let l_in = this._root.querySelector("#label_l_in");
      let r_in = this._root.querySelector("#label_r_in");

      l_in.addEventListener('click', (e) => {
        l_in.style.color = (l_in.style.color === "red") ? "lightgreen" : "red";
        this.updateRoutes(l_in, r_in);
      });

      r_in.addEventListener('click', (e) => {
        r_in.style.color = (r_in.style.color === "red") ? "lightgreen" : "red";
        this.updateRoutes(l_in, r_in);
      });

    }
  }

  try {
    customElements.define('faust-deadgate', DeadGateGui);
  } catch (error) {
    console.log(error);
    console.log("Element already defined");
  }

  // Needed, called by the SDK to instanciate the GUI
  // name is create + the name of the plugin class on top 
  // of main.js
  createAmpsimUtility = (plug) => {
    let elem = new DeadGateGui(plug);
    return elem;
  }
</script>
