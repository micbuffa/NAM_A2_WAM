          })
      });

        node.setState(state).then((data) => {
          console.log("State restored :", data)

        //let [ampNode10, elem10] = await loadPluginWithGUI(ctx, "../clean", "WasabiCleanMachine");
        let [ampNode9, elem9] = await loadPluginWithGUI(ctx, "../cleanfull", "WasabiCleanMachineFull");
        let [ampNode10, elem10] = await loadPluginWithGUI(ctx, "../blues", "WasabiBluesMachine");
        //let [ampNode10, elem10] = await loadPluginWithGUI(ctx, "../cleanfull", "WasabiCleanMachineFull");

        noisegateNode.connect(ampNode2);

        //the_plugin.connect(ampNode2);

        ampNode2.connect(ampNode9);

      loadAmps();

  });

  // live input
  var guitarPluggedIn = false;

  var constraints = {
    audio: {
      echoCancellation: false,
      mozNoiseSuppression: false,
      mozAutoGainControl: false,
      //deviceId: id ? {exact: id} : undefined
    }
  };
  // User input part 
  navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
    window.stream = stream;
    userMedia = ctx.createMediaStreamSource(stream);
  });

  function toggleGuitarInput(event) {
    ctx.resume().then(() => {
      console.log('Playback resumed successfully');
    });
    var button = document.querySelector("#toggleGuitarIn");

    if (!guitarPluggedIn) {
      userMedia.connect(the_plugin);
      button.innerHTML = "Guitar input: <span style='color:green;'>ACTIVATED</span>, click to toggle on/off!";
    } else {
      userMedia.disconnect(the_plugin);
      button.innerHTML = "Guitar input: <span style='color:red;'>NOT ACTIVATED</span>, click to toggle on/off!";
    }
    guitarPluggedIn = !guitarPluggedIn;
  }

  async function loadPluginWithGUI(ctx, url, className) {
    console.log("loading plugin url = " + url + " className = " + className);
    return new Promise((resolve, reject) => {
      var plugin = new window[className](ctx, url);

      plugin.load().then((node) => {
        plugin.loadGui().then((elem) => {
          resolve([node, elem]);
        });

      });
    });
  }
</script>
