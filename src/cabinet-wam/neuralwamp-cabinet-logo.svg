<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 82" role="img" aria-labelledby="title desc">
  <title id="title">NeuralWAMp Cabinet</title>
  <desc id="desc">A neural waveform, speaker cone, and WAM Cabinet wordmark.</desc>
  <defs>
