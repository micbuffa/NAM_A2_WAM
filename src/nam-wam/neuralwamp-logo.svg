<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 126 40" role="img" aria-labelledby="title desc">
  <title id="title">NeuralWAMp</title>
  <desc id="desc">A neural audio waveform beside a WAM monogram.</desc>
  <defs>
    <linearGradient id="badge" x1="3" y1="4" x2="36" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7b4ff"/>
      <stop offset="1" stop-color="#7856db"/>
    </linearGradient>
    <linearGradient id="word" x1="43" y1="8" x2="119" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8f5ff"/>
      <stop offset=".55" stop-color="#d8caff"/>
      <stop offset="1" stop-color="#a688ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="2" width="36" height="36" rx="10" fill="#17131d" stroke="#6f58aa"/>
  <path d="M6 23h4c2.8 0 2.8-11 5.6-11s2.8 17 5.7 17c2.8 0 2.8-13 5.6-13s2.8 7 5.6 7H36"
        fill="none" stroke="url(#badge)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#e8e0ff" stroke="#6f58aa" stroke-width="1">
    <circle cx="10" cy="23" r="2.1"/><circle cx="15.6" cy="12" r="2.1"/>
    <circle cx="21.3" cy="29" r="2.1"/><circle cx="26.9" cy="16" r="2.1"/><circle cx="32.5" cy="23" r="2.1"/>
  </g>

  <g fill="none" stroke="url(#word)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 10l5 20 6-13 6 13 5-20"/>
    <path d="M69 30l8-20 8 20M72.5 22h9"/>
    <path d="M90 30V10l9 14 9-14v20"/>
  </g>
  <path d="M114 31V17h5.3c3.8 0 5.7 2.1 5.7 5.1s-2 5.1-5.7 5.1H114m4.4-6.9h.8c1.3 0 1.9.6 1.9 1.8s-.6 1.8-1.9 1.8h-.8"
        fill="none" stroke="#a688ff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
