<!doctype html><html lang="en"><meta charset="utf-8"><title>Track sound qualification</title>
<link rel="stylesheet" href="../../../examples/wam/ui/tokens.css"><link rel="stylesheet" href="../../../examples/wam/ui/base.css"><link rel="stylesheet" href="../../../examples/wam/ui/components.css"><link rel="stylesheet" href="../../../examples/wam/host.css">
<style>body{display:block;padding:24px;background:#181b1f;color:#eee}section{margin:16px 0;padding:16px;border:1px solid #555;border-radius:12px}button{margin:4px}pre{white-space:pre-wrap}#timeline{position:relative}#list{min-height:130px}label{display:block;margin:12px 0}[hidden]{display:none!important}</style>
<h1>Track sound · the rack dock follows the Studio selection</h1><p>Real timeline, ProjectPlayer, TrackTones, TrackSoundEditor and PresetsPanel. Synthetic DI and native GainNode racks; silent audio analysis, no microphone or account writes.</p>
<button id="setup">Prepare synthetic project</button><button id="run" disabled>Run qualification</button><pre id="report" role="status">Ready</pre>
<section><h2 id="context">Play</h2><button id="studio">Studio</button><button id="playSpace">Play</button><button id="play">Play project</button><button id="saveProject">Save project</button><button id="measure">Measure playback signal</button>
<label>Rack gain <input id="gain" type="range" min="0" max="6" step=".25" value=".5"><output id="gainValue">0.5</output></label></section>
<section id="studioSection"><h2>Studio · Rock song</h2><div id="timeline"><div id="ruler"></div><div id="list"></div></div></section>
<section id="presetsPanel" hidden><p id="presetKicker"></p><strong id="presetTitle"></strong> <span id="presetMeta"></span> <span id="presetUnsaved">Unsaved</span><label>Presets <select id="presetSelect"></select></label><button id="presetNew">New preset</button><span id="presetCount"></span><div id="presetHeaderActions"><button id="presetSaveButton">Save Preset</button><button id="presetRename">Rename</button><button id="presetRevert">Revert</button><button id="presetDelete">Delete</button></div><p id="presetStatus"></p><p id="presetScope"></p></section>
<script type="module" src="../../../examples/wam/ui/index.js"></script><script type="module">
import {ProjectTimeline} from '../../../examples/wam/projects/ProjectTimeline.js';
import {ProjectPlayer} from '../../../examples/wam/projects/ProjectPlayer.js';
import {ProjectsWorkspace} from '../../../examples/wam/projects/ProjectsWorkspace.js';
import {TrackTones} from '../../../examples/wam/projects/TrackTones.js';
import {TrackSoundEditor} from '../../../examples/wam/projects/TrackSoundEditor.js';
import {soundLabel} from '../../../examples/wam/projects/TrackSoundState.js';
import PresetsPanel from '../../../examples/wam/account/PresetsPanel.js';
const $=id=>document.getElementById(id),clone=x=>structuredClone(x),wait=ms=>new Promise(r=>setTimeout(r,ms));
const state=gain=>({version:2,a:{entries:[{id:'gain',kind:'effect',state:{gain}}]},sourceTrim:{live:0,file:0}});
let editor,player,rack,workspace,timeline,panel,tones,spaces,di,analyser,library,memory=[],saves=0,measured=0;
const report=text=>$('report').textContent=typeof text==='string'?text:JSON.stringify(text,null,2);
const gainOf=async r=>(await r.getState()).a.entries[0].state.gain;
function gainRack(context,initial=state(.5)){
 const input=context.createGain(),output=context.createGain();input.connect(output);let value=clone(initial);
 return Object.assign(new EventTarget(),{a:{input,entries:[]},output,async getState(){return clone(value);},async setState(s){value=clone(s);output.gain.value=value.a.entries[0].state.gain;if(this===rack){$('gain').value=output.gain.value;$('gainValue').textContent=output.gain.value;}this.dispatchEvent(new Event('change'));},enqueue:fn=>fn(),destroy(){input.disconnect();output.disconnect();}});
}
function renderTimeline(){timeline.render(workspace.project.tracks,{editable:true,selectedId:workspace.selectedId,presetName:t=>t.presetSnapshot?soundLabel(t.presetSnapshot):library.find(p=>p.id===t.presetId)?.name});timeline.setLength({seconds:10,bars:5});}
async function measure(){await wait(250);const values=new Float32Array(2048);analyser.getFloatTimeDomainData(values);measured=Math.max(...values.map(Math.abs));return measured;}
async function select(id){workspace.selectedId=id;renderTimeline();await editor.sync();}
async function show(name){spaces.show(name);await editor.sync();}
async function setGain(value){$('gain').value=value;await $('gain').oninput();}
// Track 1 plays through its own rack (TrackTones) once the dock lets it go.
async function ownRackReady(id){for(let i=0;i<50&&tones.status(id)?.state!=='ready';i++)await wait(100);}
$('setup').onclick=async()=>{try{
 $('setup').disabled=true;const context=new AudioContext({sampleRate:48000});await context.resume();
 rack=gainRack(context);await rack.setState(state(.5));player=new ProjectPlayer(context);
 analyser=context.createAnalyser();const silent=context.createGain();silent.gain.value=0;player.output.connect(analyser).connect(silent).connect(context.destination);
 di=context.createBuffer(1,context.sampleRate*10,context.sampleRate);const pcm=di.getChannelData(0);for(let i=0;i<pcm.length;i++)pcm[i]=.1*Math.sin(2*Math.PI*220*i/context.sampleRate);
 const solo={id:1,name:'Guitar solo',origin:'personal',instrument:'guitar',volume:80,pan:0,mute:false,solo:false,audio:{url:'synthetic-di',filename:'Synthetic DI.wav'},presetSnapshot:{...state(2),origin:{name:'Original global preset',modified:false}},snapshotId:'capture',recording:{capturePresetSnapshot:state(2)}};
 // Silent second part: only its sound is edited, the measured signal is the solo's.
 const rhythm={id:2,name:'Rhythm guitar',origin:'personal',instrument:'guitar',volume:80,pan:0,mute:false,solo:false,audio:null,presetId:10};
 // The known decoded DI is installed once; edits must retain it.
 player.setTracks([{...solo,audio:null},rhythm]);player.channels.get(1).buffer=di;player.channels.get(1).key='synthetic-di||Synthetic DI.wav';
 library=[{id:9,name:'Original global preset',state:state(.25)},{id:10,name:'Alternate sound',state:state(3)}];
 const store={list:async()=>library.map(({state,...rest})=>rest),get:async id=>clone(library.find(p=>String(p.id)===String(id))),create:async(name,s)=>{const record={id:20+memory.length,name,state:clone(s)};memory.push(record);library.push(record);return clone(record);}};
 panel=new PresetsPanel({localStore:store,captureState:()=>rack.getState(),applyState:s=>rack.setState(s),defaultState:()=>state(.5),watchRack:fn=>rack.addEventListener('change',fn),storage:null,report});await panel.attach();panel.activeId=9;panel.baseline=JSON.stringify(state(.25));panel.modified=true;panel.render();
 workspace={owned:true,accountLoadEpoch:1,selectedId:null,project:{id:1,name:'Rock song',tracks:[solo,rhythm]},saved:{id:1,name:'Rock song',tracks:[clone(solo),clone(rhythm)]},recording:{pending:new Map([[1,{file:new Blob(['synthetic DI']),url:'synthetic-di'}]])},player,report,
   updateTrack:ProjectsWorkspace.prototype.updateTrack,
   setTracks(tracks){this.project.tracks=tracks;for(const t of tracks)timeline.update(t,t.id===this.selectedId);player.setTracks(tracks);tones.setTracks(tracks,1);},
   async save(){if(!await this.prepareSoundSave())return false;this.saved=clone(this.project);saves++;await this.completeSoundSave();return true;}};
 tones=workspace.tones=new TrackTones({context,player,createRack:async()=>gainRack(context),resolvePreset:async t=>t.presetSnapshot?clone(t.presetSnapshot):clone((await store.get(t.presetId)).state)});tones.setTracks(workspace.project.tracks,1);
 spaces=Object.assign(new EventTarget(),{current:'tone',show(name){this.current=name;$('studioSection').hidden=name!=='projects';this.dispatchEvent(new Event('change'));}});spaces.show('tone');
 editor=new TrackSoundEditor({workspace,rack,source:{trimDb:{live:0}},presets:panel,workspaces:spaces,context,view:e=>{
  $('context').textContent=e.active?`Studio · ${e.projectName} / ${e.title}`:spaces.current==='projects'?'Studio · no track sound shown':'Play';
 }});
 timeline=new ProjectTimeline($('list'),{root:$('timeline'),ruler:$('ruler'),onSelect:id=>void select(id),onChange:(id,f)=>workspace.updateTrack(id,f),onEdit:()=>{},onDelete:()=>{},onMonitor:()=>{},onArm:()=>{},onMove:()=>{},onSeek:s=>player.seek(s),onLoop:loop=>player.setLoop(loop)});
 renderTimeline();
 $('gain').oninput=async()=>{const s=await rack.getState();s.a.entries[0].state.gain=Number($('gain').value);await rack.setState(s);await editor.checkModified();};
 $('studio').onclick=()=>show('projects');$('playSpace').onclick=()=>show('tone');
 $('play').onclick=async()=>{if(player.playing)player.pause();else await player.play();$('play').textContent=player.playing?'Pause project':'Play project';};
 $('measure').onclick=async()=>report({signalPeak:await measure(),sameDI:player.channels.get(1).buffer===di,playing:player.playing});
 $('saveProject').onclick=async()=>{await workspace.save();report(await results());};
 $('run').disabled=false;$('run').onclick=()=>run().catch(error=>report(error.stack));
 report('Prepared · open Studio and select Guitar solo, or Run qualification');
}catch(error){report(error.stack);}};
async function results(){const solo=workspace.project.tracks[0];return {projectSaves:saves,soloGain:solo.presetSnapshot.a.entries[0].state.gain,soloOrigin:solo.presetSnapshot.origin,captureGain:solo.recording.capturePresetSnapshot.a.entries[0].state.gain,reusablePresets:memory.map(p=>p.name),sameDI:player.channels.get(1).buffer===di,libraryOriginalGain:library[0].state.a.entries[0].state.gain,playPreset:panel.activeId,signalPeak:measured};}
// The whole flow while the project plays: expected peak = rack gain × 0.1 / √2 (volume 80, centre pan).
async function run(){
 $('run').disabled=true;const checks=[],check=(name,ok,detail)=>checks.push({ok:!!ok,name,...(detail!==undefined&&{detail})}),near=(peak,gain)=>Math.abs(peak-gain*.1/Math.SQRT2)<.01;
 await show('projects');await select(1);
 check('selecting the solo shows its sound in the dock',editor.active?.trackId===1&&await gainOf(rack)===2,await gainOf(rack));
 check('the header names the origin preset',$('presetMeta').textContent==='From “Original global preset”',$('presetMeta').textContent);
 await player.play();let peak=await measure();check('the solo plays through the dock (gain 2)',near(peak,2),peak);
 await setGain(4);peak=await measure();
 check('an edit is heard live, without pausing',near(peak,4)&&player.playing,peak);
 check('the edit is pending: Apply and Revert enabled, origin marked modified',editor.modified&&!$('presetSaveButton').disabled&&!$('presetRevert').disabled&&$('presetMeta').textContent.endsWith('· modified'),$('presetMeta').textContent);
 await select(2);const solo=()=>workspace.project.tracks[0];
 check('selecting another track applies the edit to the solo',solo().presetSnapshot.a.entries[0].state.gain===4&&solo().presetSnapshot.origin?.modified===true,solo().presetSnapshot.origin);
 check('the dock now shows the rhythm guitar sound',editor.active?.trackId===2&&await gainOf(rack)===3,await gainOf(rack));
 await ownRackReady(1);peak=await measure();check('the solo keeps its applied sound on its own rack',near(peak,4),peak);
 await setGain(1);await editor.revert();check('Revert reloads the applied sound',await gainOf(rack)===3&&!editor.modified,await gainOf(rack));
 await show('tone');peak=await measure();
 check('Play gets its rack and preset back',!editor.active&&!panel.externalEditor&&await gainOf(rack)===.5&&panel.activeId===9,{gain:await gainOf(rack),preset:panel.activeId});
 check('the project plays on in Play with the applied sound',player.playing&&near(peak,4),peak);
 await show('projects');await select(1);
 check('the solo shows its applied sound and modified origin again',await gainOf(rack)===4&&$('presetMeta').textContent==='From “Original global preset” · modified',$('presetMeta').textContent);
 const ask=editor.ask;editor.ask=async()=>({reusable:true,name:'Solo crunch'});
 try{await workspace.save();}finally{editor.ask=ask;}
 const r=await results();
 check('Save project saves once and exports the reusable preset',saves===1&&memory.length===1&&memory[0].state.a.entries[0].state.gain===4,r.reusablePresets);
 check('the capture sound, the decoded DI and the library preset are untouched',r.captureGain===2&&r.sameDI&&r.libraryOriginalGain===.25,r);
 player.pause();$('play').textContent='Play project';
 report({passed:checks.every(c=>c.ok),checks,results:r});$('run').disabled=false;
}
</script></html>
